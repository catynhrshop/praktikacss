<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практическая работа CSS</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: white;
    }

    .page {
        width: 1000px;
        height: 800px;
        margin: 50px auto 0;
    }

    .header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .menu {
        width: 700px;
        height: 100px;
        background-color: red;
        color: white;
        text-align: center;
        line-height: 100px;
        font-size: 24px;
        border: 1px solid black;
    }

    .datetime {
        width: 250px;
        height: 100px;
        background-color: black;
        color: white;
        text-align: center;
        line-height: 100px;
        font-size: 22px;
        border: 1px solid black;
    }

    .content {
        width: 100%;
        height: 300px;
        background-color: green;
        color: white;
        text-align: center;
        line-height: 300px;
        font-size: 28px;
        border: 1px solid black;
        box-sizing: border-box;
    }

    .footer {
        width: 100%;
        height: 100px;
        background-color: yellow;
        color: black;
        text-align: center;
        line-height: 100px;
        font-size: 24px;
        border: 1px solid black;
        box-sizing: border-box;
        margin-top: 20px;
    }
</style>
</head>

<body>

<div class="page">

    <div class="header">
        <div class="menu">Верхнее меню</div>
        <div class="datetime" id="clock"></div>
    </div>

    <div class="content">
        Зона содержимого
    </div>

    <div class="footer">
        Футер
    </div>

</div>

<script>
function updateClock() {
    const now = new Date();
    document.getElementById("clock").innerHTML =
        now.toLocaleDateString() + "<br>" +
        now.toLocaleTimeString();
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
